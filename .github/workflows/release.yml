name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Bauabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Paket bauen
        run: make deb

      - name: Tag und Paketversion vergleichen
        run: |
          version=$(dpkg-deb -f ./*.deb Version)
          tag=${GITHUB_REF_NAME#v}
          [ "$tag" = "$version" ] || [ "$tag-1" = "$version" ] ||
            { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Paketversion $version"; exit 1; }

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.deb --title "ZDF-Downloader ${GITHUB_REF_NAME#v}" --generate-notes

      - name: In VPRepo veröffentlichen
        uses: EureLordschaft008/VPRepo/.github/actions/publish@main
        with:
          deploy-key: ${{ secrets.VPREPO_DEPLOY_KEY }}
